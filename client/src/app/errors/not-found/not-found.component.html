<div class="container">
    <h1>Not found</h1>
    <ng-container *ngIf="currentUser$ | async">
      <!-- For authenticated users -->
      <button class="btn btn-info btn-lg" (click)="returnToMembersPage()">Return to Members page</button>
    </ng-container>
  
    <ng-container *ngIf="!(currentUser$ | async)">
        <!-- For unauthenticated users -->
      <button class="btn btn-info btn-lg" (click)="goToHomePage()">Go Back to Home page</button>
    </ng-container>
  </div>
